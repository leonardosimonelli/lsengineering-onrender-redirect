name: Sync LS Engineering site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published site from canonical Cloudflare origin
        run: |
          set -eu
          mkdir -p site
          cat site-paths.txt | while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "FETCH $file"
            mkdir -p "site/$(dirname "$file")"
            if curl --fail --location --silent --show-error --retry 3 --max-time 40 "https://dawn-mouse-7a3c.ing-simonelli-leonardo.workers.dev/$file" --output "site/$file"; then
              echo "OK $file"
            else
              echo "FAILED $file"
              exit 1
            fi
          done
          test -s site/index.html
          test "$(find site -type f | wc -l)" -ge 45
      - name: Store site snapshot in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/
          if ! git diff --cached --quiet; then
            git commit -m 'Mirror live LS Engineering static site'
            git push
          fi
